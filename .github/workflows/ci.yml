# Verifies krizaka-users on every change (unit tests, Testcontainers integration tests, javadoc,
# sources) after building the Krizaka repositories it stands on; on a v* tag signs the published
# modules and uploads them to Maven Central. The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    uses: krizaka/.github/.github/workflows/maven.yml@cf1e598a446ed2d4d98b98a67ec9795c0f80100d # main
    with:
      upstreams: "krizaka-build krizaka-platform-kit"
      rewrite: true
      sonar: true   # CI analysis with JaCoCo coverage; the merge queue branch is analysed too
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
