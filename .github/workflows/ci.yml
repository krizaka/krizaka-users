# Verifies krizaka-users on every change (unit tests, Testcontainers integration tests, javadoc,
# sources) after building the Krizaka repositories it stands on; on a v* tag signs the published
# modules and uploads them to Maven Central. The pipeline is the organisation's:
# krizaka/.github/.github/workflows/maven.yml.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  maven:
    permissions:
      contents: read
      packages: write
    uses: krizaka/.github/.github/workflows/maven.yml@6bfc6ea4053a7e6378e0af9a0ec7ef95f963c30a # main (pin carries the deploy permissions fix)
    with:
      registry: github   # GitHub Packages (ADR-019): krizaka-parent, the BOM and the platform kit resolve from there, no upstream checkout
      upstreams: "krizaka-platform-kit"   # krizaka-security 0.4.1 is tagged but not on GitHub Packages yet: built from main and installed; drop this line once the kit's next release is published there
      rewrite: true
      sonar: true   # CI analysis with JaCoCo coverage; the merge queue branch is analysed too
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
